<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automated Mafia Game</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 15px; }
    .card { background: #1e1e1e; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; }
    input, button, select { width: 90%; padding: 10px; margin: 5px; font-size: 16px; border-radius: 5px; }
    button { background: #e50914; color: white; border: none; font-weight: bold; cursor: pointer; }
    .hidden { display: none; }
    .alive { color: #2ed573; }
    .dead { color: #ff4757; text-decoration: line-through; }
    #timer { font-size: 28px; color: #ffa500; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🕵️ Mafia Game</h1>
  <div id="announcement" style="color:#00d2d3; font-weight:bold; margin:10px 0;"></div>
  <div id="timer"></div>

  <!-- Step 1: Join Room -->
  <div id="join-sec" class="card">
    <h3>Join Game</h3>
    <input type="text" id="username" placeholder="Enter Your Name">
    <button onclick="join()">Join as Player</button>
  </div>

  <!-- Step 2: Role Config (Visible before start) -->
  <div id="setup-sec" class="card hidden">
    <h3>Game Setup (Optional Config)</h3>
    <label>Mafia: <input type="number" id="cfg-mafia" value="1" min="1"></label><br>
    <label>Doctor: <input type="number" id="cfg-doctor" value="1" min="0"></label><br>
    <label>Suicide Bomber: <input type="number" id="cfg-bomber" value="1" min="0"></label><br>
    <label>Common Man: <input type="number" id="cfg-common" value="2" min="1"></label><br>
    <label>Total Rounds: <input type="number" id="cfg-rounds" value="3" min="1"></label><br>
    <button onclick="startGame()">Start Game for Everyone</button>
  </div>

  <!-- Game Main Screen -->
  <div id="game-sec" class="card hidden">
    <p>Your Role: <strong id="my-role" style="color:#ff4757;">???</strong></p>
    <h3 id="phase-title">Waiting...</h3>
    <div id="action-area"></div>
  </div>

  <!-- Live Player Roster / Final End Game Reveal -->
  <div class="card">
    <h3>Players & End Game Roles</h3>
    <ul id="player-list" style="list-style:none; padding:0;"></ul>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myId = '';
    let myRole = '';
    let allPlayers = [];

    function join() {
      const name = document.getElementById('username').value;
      if (name) {
        socket.emit('joinGame', { name });
        myId = socket.id;
        document.getElementById('join-sec').classList.add('hidden');
        document.getElementById('setup-sec').classList.remove('hidden');
        document.getElementById('game-sec').classList.remove('hidden');
      }
    }

    function startGame() {
      const config = {
        mafia: parseInt(document.getElementById('cfg-mafia').value),
        doctor: parseInt(document.getElementById('cfg-doctor').value),
        bomber: parseInt(document.getElementById('cfg-bomber').value),
        common: parseInt(document.getElementById('cfg-common').value)
      };
      const rounds = document.getElementById('cfg-rounds').value;
      socket.emit('setupAndStartGame', { config, rounds });
      document.getElementById('setup-sec').classList.add('hidden');
    }

    socket.on('assignRole', (role) => {
      myRole = role;
      document.getElementById('my-role').innerText = role;
    });

    socket.on('timerUpdate', (time) => {
      document.getElementById('timer').innerText = time > 0 ? "Time Remaining: " + time + "s" : "";
    });

    socket.on('announcement', (msg) => {
      document.getElementById('announcement').innerText = msg;
    });

    socket.on('updateState', (game) => {
      allPlayers = game.players;
      renderPlayerList(allPlayers, false);
    });

    socket.on('phaseChange', (phase) => {
      const area = document.getElementById('action-area');
      area.innerHTML = '';

      if (phase === 'NIGHT') {
        document.getElementById('phase-title').innerText = "🌙 CITY SLEEP! Night Phase";
        if (['Mafia', 'Doctor', 'Suicide Bomber'].includes(myRole)) {
          area.innerHTML = `<p>Select your target:</p>` + renderPlayerSelect();
        } else {
          area.innerHTML = `<p>Close your eyes. Common men are sleeping...</p>`;
        }
      } else if (phase === 'DAY_VOTING') {
        document.getElementById('phase-title').innerText = "☀️ CITY OPEN! Day Discussion & Voting";
        area.innerHTML = `<p>Vote to eliminate a suspect:</p>` + renderVoteSelect();
      } else if (phase === 'GAME_OVER') {
        document.getElementById('phase-title').innerText = "🏆 GAME OVER!";
        area.innerHTML = `<p>Check all player roles below!</p>`;
      }
    });

    socket.on('revealRoles', (players) => {
      renderPlayerList(players, true);
    });

    function renderPlayerSelect() {
      let html = '<select id="target-select">';
      allPlayers.filter(p => p.isAlive).forEach(p => {
        html += `<option value="${p.id}">${p.name}</option>`;
      });
      html += '</select><button onclick="submitAction()">Submit Night Target</button>';
      return html;
    }

    function renderVoteSelect() {
      let html = '<select id="vote-select">';
      allPlayers.filter(p => p.isAlive).forEach(p => {
        html += `<option value="${p.id}">${p.name}</option>`;
      });
      html += '</select><button onclick="submitVote()">Cast Vote</button>';
      return html;
    }

    function submitAction() {
      const targetId = document.getElementById('target-select').value;
      socket.emit('nightAction', { targetId });
      document.getElementById('action-area').innerHTML = '<p>Target submitted! Wait for night to end...</p>';
    }

    function submitVote() {
      const targetId = document.getElementById('vote-select').value;
      socket.emit('castVote', { targetId });
      document.getElementById('action-area').innerHTML = '<p>Vote cast! Waiting for countdown...</p>';
    }

    function renderPlayerList(players, revealAll = false) {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        const statusClass = p.isAlive ? 'alive' : 'dead';
        const roleText = (revealAll || p.id === socket.id) && p.role ? ` [${p.role}]` : '';
        li.className = statusClass;
        li.innerText = `${p.name}${roleText} - ${p.isAlive ? 'Alive' : 'Dead'}`;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
